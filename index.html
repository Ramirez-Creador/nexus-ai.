<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#00cfff"><meta name="description" content="NEXUS, asistente personal de demostración con chat y voz"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><title>NEXUS AI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 12%,#10385a,#030b1a 62%);color:#e6faff;font-family:Arial,sans-serif;min-height:100dvh}.app{max-width:520px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;color:#00dfff;font-weight:bold;letter-spacing:2px}.top span{font-size:10px;color:#54ffba;letter-spacing:0}.core{width:170px;height:170px;border:3px solid #00dfff;border-radius:50%;margin:32px auto 15px;display:grid;place-items:center;box-shadow:0 0 35px #008bff,inset 0 0 22px #006eaa;animation:pulse 3s infinite}.inner{font-size:75px;color:#00eaff;text-shadow:0 0 20px #00eaff}@keyframes pulse{50%{box-shadow:0 0 65px #00eaff,inset 0 0 35px #006eaa}}h1,p{text-align:center}h1{letter-spacing:6px;margin-bottom:8px}p{color:#89b6c9;font-size:13px}#chat{height:clamp(220px,35dvh,360px);overflow:auto;background:#07182be8;border:1px solid #125475;border-radius:12px;padding:12px}.msg{padding:11px;margin:8px 0;border-radius:9px;max-width:88%;overflow-wrap:anywhere;line-height:1.4}.ai{background:#123552}.user{background:#005c85;margin-left:auto}.controls{display:flex;gap:6px;margin-top:15px}input{flex:1;min-width:0;background:#07182b;color:white;border:1px solid #00cfff;border-radius:8px;padding:12px;font-size:16px}button{background:#00cfff;border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:17px}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:2px}.note{font-size:11px;line-height:1.5;margin-top:16px}
</style></head><body><main class="app"><div class="top">NEXUS <span>● SISTEMA ACTIVO</span></div><div class="core" aria-hidden="true"><div class="inner">N</div></div><h1>NEXUS AI</h1><p id="status">Asistente personal · modo demostración</p><div id="chat" role="log" aria-live="polite"><div class="msg ai">Hola. Soy NEXUS. ¿En qué puedo ayudarte?</div></div><form id="controls" class="controls"><input id="message" aria-label="Mensaje para NEXUS" placeholder="Escribe tu mensaje..." autocomplete="off"><button type="submit" aria-label="Enviar mensaje">➤</button><button type="button" id="mic" aria-label="Hablar con NEXUS">🎤</button></form><p class="note">Versión de demostración: responde a comandos básicos. La voz depende del navegador; aún no está conectada a un modelo de IA.</p></main><script>
const chat=document.getElementById('chat'),input=document.getElementById('message'),status=document.getElementById('status');
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function reply(t){const s=t.toLowerCase();if(s.includes('hola'))return 'Hola. Soy NEXUS, tu asistente personal.';if(s.includes('nombre'))return 'Mi nombre es NEXUS.';if(s.includes('hora'))return 'Son las '+new Date().toLocaleTimeString('es-MX');if(s.includes('fecha'))return 'Hoy es '+new Date().toLocaleDateString('es-MX');if(s.includes('ayuda'))return 'Puedo saludarte, decirte la fecha y la hora. Pronto tendré más inteligencia.';return 'Todavía estoy en modo demostración. Necesito conectar un modelo de IA para responder esa pregunta.'}
function speak(t){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function send(){const t=input.value.trim();if(!t)return;add(t,'user');input.value='';const r=reply(t);add(r,'ai');speak(r)}
document.getElementById('controls').addEventListener('submit',e=>{e.preventDefault();send()});
document.getElementById('mic').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('El reconocimiento de voz no está disponible en este navegador.','ai');return}const r=new SR();r.lang='es-MX';r.onstart=()=>{status.textContent='Escuchando...'};r.onend=()=>{status.textContent='Asistente personal · modo demostración'};r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.onerror=e=>add('No pude escuchar: '+e.error,'ai');try{r.start()}catch(e){add('No se pudo iniciar el micrófono.','ai')}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
